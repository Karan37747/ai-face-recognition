<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}FaceAttend{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}"/>
  <style>
    :root {
      --bg:        #f0f2f8;
      --surface:   #ffffff;
      --surface2:  #f7f8fc;
      --border:    #e8eaf2;
      --text:      #1a1d2e;
      --text2:     #6b7280;
      --text3:     #9ca3af;
      --primary:   #5b5ef4;
      --primary-l: #ededfe;
      --success:   #10b981;
      --success-l: #d1fae5;
      --danger:    #ef4444;
      --danger-l:  #fee2e2;
      --warning:   #f59e0b;
      --warning-l: #fef3c7;
      --sidebar-w: 240px;
      --radius:    14px;
      --shadow:    0 1px 4px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 24px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed; top: 0; left: 0;
      width: var(--sidebar-w); height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      z-index: 1000; transition: transform .3s;
    }
    .sidebar-brand {
      padding: 20px 18px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #fff; flex-shrink: 0;
    }
    .brand-name { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); }
    .brand-sub  { font-size: 10px; color: var(--text3); margin-top: 1px; }

    .nav-label {
      padding: 16px 18px 6px;
      font-size: 10px; font-weight: 600;
      color: var(--text3); text-transform: uppercase; letter-spacing: 1px;
    }
    .sidebar-nav { list-style: none; padding: 6px 10px; flex: 1; overflow-y: auto; }
    .sidebar-nav a {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 12px; border-radius: 9px;
      color: var(--text2); text-decoration: none;
      font-size: 13.5px; font-weight: 500;
      transition: all .15s; margin-bottom: 1px;
    }
    .sidebar-nav a:hover { background: var(--surface2); color: var(--text); }
    .sidebar-nav a.active { background: var(--primary-l); color: var(--primary); font-weight: 600; }
    .sidebar-nav i { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

    .sidebar-footer {
      padding: 14px 10px;
      border-top: 1px solid var(--border);
    }
    .user-pill {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
    }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0;
    }
    .user-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.2; }
    .user-role { font-size: 11px; color: var(--text3); }
    .logout-btn {
      margin-left: auto; width: 30px; height: 30px;
      border-radius: 8px; display: flex;
      align-items: center; justify-content: center;
      color: var(--text3); text-decoration: none;
      transition: all .15s; flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 15px;
    }
    .logout-btn:hover { background: var(--danger-l); color: var(--danger); border-color: var(--danger); }

    /* ── Main ── */
    .main-content { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      height: 60px; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .page-title { font-family: 'Plus Jakarta Sans',sans-serif; font-size: 18px; font-weight: 700; color: var(--text); }
    .page-subtitle { font-size: 12px; color: var(--text3); margin-top: 1px; }
    .content-area { padding: 24px; flex: 1; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card-header {
      background: transparent;
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      font-weight: 600; font-size: 13.5px;
      color: var(--text); display: flex; align-items: center; gap: 8px;
    }

    /* ── Stat Cards ── */
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px; box-shadow: var(--shadow);
      transition: box-shadow .2s, transform .2s;
    }
    .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .stat-icon {
      width: 44px; height: 44px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; margin-bottom: 14px;
    }
    .stat-value { font-family: 'Plus Jakarta Sans',sans-serif; font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; }
    .stat-label { font-size: 12px; color: var(--text3); margin-top: 4px; font-weight: 500; }
    .stat-change { font-size: 11px; font-weight: 600; margin-top: 8px; }
    .stat-change.up { color: var(--success); }
    .stat-change.neutral { color: var(--text3); }

    .stat-blue   .stat-icon { background: #eff6ff; color: #3b82f6; }
    .stat-purple .stat-icon { background: var(--primary-l); color: var(--primary); }
    .stat-green  .stat-icon { background: var(--success-l); color: var(--success); }
    .stat-orange .stat-icon { background: #fff7ed; color: #f97316; }

    /* ── Buttons ── */
    .btn-primary-custom {
      background: var(--primary); color: #fff;
      border: none; border-radius: 9px;
      padding: 8px 16px; font-size: 13px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all .15s; cursor: pointer; text-decoration: none;
    }
    .btn-primary-custom:hover { background: #4a4dd4; color: #fff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(91,94,244,0.3); }
    .btn-outline-custom {
      background: transparent; color: var(--primary);
      border: 1px solid var(--primary); border-radius: 9px;
      padding: 7px 14px; font-size: 13px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all .15s; cursor: pointer; text-decoration: none;
    }
    .btn-outline-custom:hover { background: var(--primary-l); color: var(--primary); }
    .btn-ghost {
      background: var(--surface2); color: var(--text2);
      border: 1px solid var(--border); border-radius: 9px;
      padding: 7px 14px; font-size: 13px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all .15s; cursor: pointer; text-decoration: none;
    }
    .btn-ghost:hover { background: var(--border); color: var(--text); }

    /* ── Tables ── */
    .table-wrap { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
    .table-wrap table { margin: 0; width: 100%; }
    .table-wrap thead th {
      background: var(--surface2);
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .8px;
      color: var(--text3); padding: 12px 16px; border: none;
      border-bottom: 1px solid var(--border);
    }
    .table-wrap tbody tr { border-color: var(--border); transition: background .1s; }
    .table-wrap tbody tr:hover { background: var(--surface2); }
    .table-wrap tbody td {
      color: var(--text); font-size: 13.5px;
      padding: 12px 16px; border-color: var(--border);
      vertical-align: middle;
    }
    .table-wrap tbody tr:last-child td { border-bottom: none; }

    /* ── Badges ── */
    .badge-present { background: var(--success-l); color: var(--success); border-radius: 99px; padding: 3px 10px; font-size: 11px; font-weight: 600; }
    .badge-absent  { background: var(--danger-l);  color: var(--danger);  border-radius: 99px; padding: 3px 10px; font-size: 11px; font-weight: 600; }
    .badge-late    { background: var(--warning-l); color: var(--warning); border-radius: 99px; padding: 3px 10px; font-size: 11px; font-weight: 600; }
    .badge-pill    { background: var(--primary-l); color: var(--primary); border-radius: 99px; padding: 3px 10px; font-size: 11px; font-weight: 600; }

    /* ── Forms ── */
    .form-control, .form-select {
      background: var(--surface2) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      border-radius: 9px; font-size: 13.5px;
      padding: 9px 14px;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 3px rgba(91,94,244,0.1) !important;
      background: var(--surface) !important;
    }
    .form-label { font-size: 12.5px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }

    /* ── Alerts ── */
    .alert { border-radius: 10px; font-size: 13.5px; border: none; }
    .alert-success { background: var(--success-l); color: #065f46; }
    .alert-danger  { background: var(--danger-l);  color: #991b1b; }
    .alert-warning { background: var(--warning-l); color: #92400e; }
    .alert-info    { background: var(--primary-l); color: #3730a3; }

    /* ── Progress ── */
    .progress { background: var(--border); border-radius: 99px; height: 6px; }
    .progress-bar { background: var(--primary); border-radius: 99px; }

    /* ── Live dot ── */
    .dot-live { width: 8px; height: 8px; background: var(--success); border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(0.8)} }

    /* ── Mobile ── */
    .sidebar-toggle { display: none; }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .sidebar-toggle { display: flex; }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── Misc ── */
    .text-primary-custom { color: var(--primary); }
    .text-muted-custom   { color: var(--text3); }
    body { animation: fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<div id="sidebarOverlay" onclick="toggleSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:999;backdrop-filter:blur(2px)"></div>

{% block body %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
function toggleSidebar(){
  const s=document.querySelector('.sidebar');
  const o=document.getElementById('sidebarOverlay');
  s.classList.toggle('open');
  o.style.display=s.classList.contains('open')?'block':'none';
}
document.querySelectorAll('.alert.alert-dismissible').forEach(a=>{
  setTimeout(()=>{ try{ bootstrap.Alert.getOrCreateInstance(a).close(); }catch(e){} },4000);
});
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
